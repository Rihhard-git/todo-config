apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app-production
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Rihhard-git/todo-config
    targetRevision: main
    path: overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: project-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true